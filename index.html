<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090d12"><title>AulaFlow Padel</title><link rel="manifest" href="manifest.webmanifest"><style>
:root{--bg:#090d12;--p:#121c26;--p2:#1a2935;--line:#2b3b49;--t:#f1f5f9;--m:#94a3b8;--g:#b7f34a;--r:#fb7185;--y:#fbbf24}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% -10%,#203426,transparent 35%),var(--bg);color:var(--t);font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:1000px;margin:auto;padding:16px 14px 90px}.top,.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.top{margin:4px 0 18px}.brand{display:flex;align-items:center;gap:10px}.logo{background:var(--g);color:#10170b;font-weight:900;font-size:22px;border-radius:13px;padding:9px 14px}.brand h1{font-size:18px;margin:0}.brand small,.sub,.muted,small{color:var(--m)}.brand small{font-size:10px}nav{display:flex;gap:7px;overflow:auto;margin-bottom:15px}button{cursor:pointer;font:inherit}.nav,.btn{border:1px solid var(--line);background:var(--p);color:var(--t);padding:10px 13px;border-radius:11px;white-space:nowrap}.nav.active,.primary{background:var(--g);color:#11180a;border-color:var(--g);font-weight:800}.danger{color:var(--r)}h2{font-size:24px;margin:8px 0 3px}.sub{font-size:13px;margin:0 0 17px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.card{background:linear-gradient(145deg,#15212c,#101720);border:1px solid var(--line);border-radius:16px;padding:15px;margin:10px 0}.metric small{font-size:12px}.metric strong{display:block;font-size:23px;margin-top:8px}.green{color:var(--g)}.list{display:grid;gap:8px}.item{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#0c141c;border:1px solid var(--line);border-radius:12px;padding:12px}.item strong{font-size:13px}.item small{display:block;margin-top:4px;font-size:11px}.tag{font-size:10px;border-radius:30px;padding:5px 8px;background:#263744;white-space:nowrap}.good{color:var(--g)}.warn{color:var(--y)}.bad{color:var(--r)}.toolbar,.actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}input,select,textarea{width:100%;background:#0b121a;color:var(--t);border:1px solid #344757;border-radius:10px;padding:11px;font:inherit}label{display:block;color:var(--m);font-size:12px;margin-bottom:6px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}.week{display:grid;grid-template-columns:repeat(7,minmax(100px,1fr));gap:7px;overflow:auto}.day{background:#101923;border:1px solid var(--line);border-radius:12px;padding:9px;min-height:120px}.dayhead{font-size:11px;color:var(--m);margin-bottom:8px}.lesson{font-size:11px;background:#1b2c1d;border-left:3px solid var(--g);padding:7px;border-radius:7px;margin:5px 0}.lesson b{display:block}.empty{color:#718096;text-align:center;padding:20px;font-size:13px}.modal{display:none;position:fixed;inset:0;background:#000b;z-index:5;align-items:flex-end;justify-content:center;padding:10px}.modal.open{display:flex}.dialog{background:#121c26;border:1px solid var(--line);border-radius:18px;width:min(620px,100%);max-height:92vh;overflow:auto;padding:16px}.dialog h3{margin:0 0 14px}.foot{text-align:center;color:#657487;font-size:10px;margin-top:22px}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}.formgrid{grid-template-columns:1fr}.week{grid-template-columns:repeat(7,112px)}}
.syncbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.syncstate{font-size:11px;border:1px solid var(--line);border-radius:20px;padding:7px 9px;color:var(--m)}.syncstate.ok{color:var(--g);border-color:#42602b}.syncstate.err{color:var(--r);border-color:#713344}.syncstate.wait{color:var(--y);border-color:#66552c}.sync-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.sync-note{font-size:12px;color:var(--m);line-height:1.5}.sync-email{font-size:13px;color:var(--g)}@media(max-width:480px){.top{align-items:flex-start}.syncbar{justify-content:flex-end}.brand h1{font-size:16px}} </style></head><body><div class="app"><header class="top"><div class="brand"><div class="logo">A</div><div><h1>AulaFlow Padel</h1><small>GESTÃO DE AULAS • SINCRONIZAÇÃO + BACKUP</small></div></div><div class="syncbar"><span id="syncStatus" class="syncstate">● Somente neste aparelho</span><button class="btn" onclick="openSync()">Conta / Sincronizar</button></div></header><nav id="nav"></nav><main id="view"></main><div class="foot">Dados locais com cópias automáticas neste navegador. Mantenha cópia externa no Google Drive.</div></div><div class="modal" id="modal"><div class="dialog"><div class="row"><h3 id="mt"></h3><button class="btn" onclick="closeM()">Fechar ✕</button></div><div id="mb"></div></div></div>
<script>
// Configuração pública do Supabase. A chave publishable pode ficar no navegador;
// a proteção dos registros é feita por autenticação e Row Level Security (RLS).
const SUPABASE_URL='https://ndumiebacngoytkhhagd.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_qmICeuCNigbxYxg2657d-g_lsNktTPH';
let sb=null, authUser=null, syncReady=false, remoteRevision=0, syncDirty=false;
let syncTimer=null, syncChannel=null, pendingCloudConflict=null, lastSyncedSnapshot='';
const cloudTable='aulaflow_state';
function syncBadge(message,kind=''){const el=document.getElementById('syncStatus');if(!el)return;el.textContent=message;el.className='syncstate '+kind;}
function dataHasRecords(d){return !!d&&(d.students?.length||d.lessons?.length||d.tx?.length);}
function normalizedCloudData(d){return d&&Array.isArray(d.students)&&Array.isArray(d.lessons)&&Array.isArray(d.tx)?d:{students:[],lessons:[],tx:[]};}
function openSync(){
 const email=authUser?.email;
 let body='';
 if(!window.supabase){body='<p class="sync-note">A biblioteca de conexão ainda não carregou. Verifique a internet e recarregue a página.</p>';}
 else if(!authUser){body=`<p class="sync-note">Entre com o mesmo e-mail no computador e no iPhone. Enviaremos um link de acesso por e-mail; não é necessário criar senha no AulaFlow.</p><label>E-mail da sua conta</label><input id="syncEmail" type="email" autocomplete="email" placeholder="seu@email.com" required><div class="sync-actions"><button class="btn primary" onclick="sendSyncLink()">Enviar link de acesso</button></div><p class="sync-note">O link abre o AulaFlow e autoriza este dispositivo. Seus dados continuam salvos localmente enquanto estiver offline.</p>`;}
 else {body=`<p>Conectado como <span class="sync-email">${esc(email)}</span></p><p class="sync-note">${syncReady?'Sincronização habilitada. As alterações são salvas neste aparelho e enviadas ao banco central quando houver internet.':'Preparando a primeira sincronização…'}</p>${pendingCloudConflict?`<div class="card"><b class="warn">Conflito de alterações</b><p class="sync-note">O banco recebeu alterações enquanto este aparelho também tinha mudanças pendentes. Escolha qual versão manter.</p><div class="sync-actions"><button class="btn primary" onclick="useCloudVersion()">Usar versão da nuvem</button><button class="btn danger" onclick="keepLocalVersion()">Manter este aparelho e sobrescrever a nuvem</button></div></div>`:''}<div class="sync-actions"><button class="btn primary" onclick="syncNow()">Sincronizar agora</button><button class="btn" onclick="signOutSync()">Sair desta conta</button></div>`;}
 modal('Sincronização do AulaFlow',body);
}
async function sendSyncLink(){
 const email=document.getElementById('syncEmail')?.value?.trim();if(!email||!email.includes('@'))return alert('Informe um e-mail válido.');
 try{const {error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+location.pathname}});if(error)throw error;modal('Link enviado',`<p>Enviamos um link de acesso para <b>${esc(email)}</b>.</p><p class="sync-note">Abra o e-mail neste dispositivo e toque no link. Para conectar o outro aparelho, repita o processo usando o mesmo e-mail.</p><button class="btn primary" onclick="closeM()">Entendi</button>`);}catch(e){alert('Não foi possível enviar o link: '+(e.message||e));}
}
async function initCloud(){
 if(!window.supabase){syncBadge('● Local — conexão indisponível','err');return;}
 try{sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  const {data,error}=await sb.auth.getSession();if(error)throw error;
  if(data.session?.user)await activateSyncUser(data.session.user);else syncBadge('● Somente neste aparelho');
  sb.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_IN'&&session?.user){if(authUser?.id!==session.user.id)queueMicrotask(()=>activateSyncUser(session.user));}else if(event==='SIGNED_OUT'){authUser=null;syncReady=false;syncDirty=false;remoteRevision=0;pendingCloudConflict=null;if(syncChannel)sb.removeChannel(syncChannel);syncChannel=null;syncBadge('● Somente neste aparelho');}});
 }catch(e){syncBadge('● Erro de conexão','err');console.error('AulaFlow Supabase:',e);}
}
async function activateSyncUser(user){
 if(authUser?.id===user.id&&syncReady)return;authUser=user;syncReady=false;syncBadge('● Carregando dados…','wait');
 try{
  const {data:row,error}=await sb.from(cloudTable).select('data,revision,updated_at').eq('user_id',user.id).maybeSingle();if(error)throw error;
  if(!row){const {data:created,error:insertError}=await sb.from(cloudTable).insert({user_id:user.id,data:db,revision:1,updated_at:new Date().toISOString()}).select('revision').single();if(insertError)throw insertError;remoteRevision=created.revision;syncReady=true;syncDirty=false;lastSyncedSnapshot=JSON.stringify(db);subscribeCloud();syncBadge('● Sincronizado','ok');render();return;}
  const cloudData=normalizedCloudData(row.data),localHas=dataHasRecords(db),cloudHas=dataHasRecords(cloudData);
  if(localHas&&cloudHas){const useLocal=confirm(`Já existem dados na nuvem e também neste aparelho.

OK = enviar os dados deste aparelho para a nuvem (substitui a versão online).
Cancelar = baixar os dados da nuvem (substitui os dados locais).

Faça backup antes de escolher.`);if(useLocal){const {data:updated,error:updateError}=await sb.from(cloudTable).update({data:db,revision:Number(row.revision)+1,updated_at:new Date().toISOString()}).eq('user_id',user.id).eq('revision',row.revision).select('revision').maybeSingle();if(updateError)throw updateError;if(!updated){pendingCloudConflict=row;syncBadge('● Conflito — escolha a versão','err');openSync();return;}remoteRevision=updated.revision;lastSyncedSnapshot=JSON.stringify(db);}else{await createLocalSnapshot(true);db=cloudData;localStorage.setItem(K,JSON.stringify(db));remoteRevision=Number(row.revision)||1;lastSyncedSnapshot=JSON.stringify(db);render();}}
  else if(localHas&&!cloudHas){const {data:updated,error:updateError}=await sb.from(cloudTable).update({data:db,revision:Number(row.revision)+1,updated_at:new Date().toISOString()}).eq('user_id',user.id).eq('revision',row.revision).select('revision').maybeSingle();if(updateError)throw updateError;if(!updated){pendingCloudConflict=row;syncBadge('● Conflito — escolha a versão','err');openSync();return;}remoteRevision=updated.revision;lastSyncedSnapshot=JSON.stringify(db);}
  else{db=cloudData;localStorage.setItem(K,JSON.stringify(db));remoteRevision=Number(row.revision)||1;lastSyncedSnapshot=JSON.stringify(db);render();}
  syncReady=true;syncDirty=false;subscribeCloud();syncBadge('● Sincronizado','ok');
 }catch(e){syncReady=false;syncBadge('● Falha na sincronização','err');console.error(e);alert('A conta entrou, mas não foi possível carregar/sincronizar os dados. Confira as políticas e a tabela no Supabase: '+(e.message||e));}
}
function subscribeCloud(){if(syncChannel)sb.removeChannel(syncChannel);syncChannel=sb.channel('aulaflow-state-'+authUser.id).on('postgres_changes',{event:'UPDATE',schema:'public',table:cloudTable,filter:'user_id=eq.'+authUser.id},payload=>{const row=payload.new;if(!row)return;const incoming=JSON.stringify(normalizedCloudData(row.data));if(incoming===JSON.stringify(db)){remoteRevision=Number(row.revision)||remoteRevision;lastSyncedSnapshot=incoming;syncDirty=false;syncBadge('● Sincronizado','ok');return;}if(syncDirty||JSON.stringify(db)!==lastSyncedSnapshot){pendingCloudConflict=row;remoteRevision=Number(row.revision)||remoteRevision;syncBadge('● Conflito entre aparelhos','err');return;}db=normalizedCloudData(row.data);localStorage.setItem(K,JSON.stringify(db));remoteRevision=Number(row.revision)||remoteRevision;lastSyncedSnapshot=JSON.stringify(db);render();syncBadge('● Atualizado pela nuvem','ok');}).subscribe();}
function scheduleCloudSync(){clearTimeout(syncTimer);syncBadge(navigator.onLine?'● Aguardando envio…':'● Offline — salvo neste aparelho','wait');if(!navigator.onLine)return;syncTimer=setTimeout(syncNow,900);}
async function syncNow(){if(!authUser||!syncReady){openSync();return;}if(pendingCloudConflict){openSync();return;}if(!navigator.onLine){syncBadge('● Offline — salvo neste aparelho','wait');return;}const snapshot=JSON.stringify(db);if(snapshot===lastSyncedSnapshot){syncDirty=false;syncBadge('● Sincronizado','ok');return;}syncBadge('● Enviando alterações…','wait');try{const {data,error}=await sb.from(cloudTable).update({data:JSON.parse(snapshot),revision:remoteRevision+1,updated_at:new Date().toISOString()}).eq('user_id',authUser.id).eq('revision',remoteRevision).select('revision').maybeSingle();if(error)throw error;if(!data){const {data:latest,error:readError}=await sb.from(cloudTable).select('data,revision,updated_at').eq('user_id',authUser.id).single();if(readError)throw readError;pendingCloudConflict=latest;remoteRevision=Number(latest.revision)||remoteRevision;syncBadge('● Conflito entre aparelhos','err');openSync();return;}remoteRevision=Number(data.revision);lastSyncedSnapshot=snapshot;syncDirty=JSON.stringify(db)!==snapshot;syncBadge('● Sincronizado','ok');if(syncDirty)scheduleCloudSync();}catch(e){syncBadge('● Falha ao sincronizar','err');console.error(e);}}
async function useCloudVersion(){if(!pendingCloudConflict)return;await createLocalSnapshot(true);db=normalizedCloudData(pendingCloudConflict.data);localStorage.setItem(K,JSON.stringify(db));remoteRevision=Number(pendingCloudConflict.revision)||remoteRevision;lastSyncedSnapshot=JSON.stringify(db);pendingCloudConflict=null;syncDirty=false;render();syncBadge('● Sincronizado','ok');closeM();}
async function keepLocalVersion(){if(!pendingCloudConflict||!authUser)return;if(!confirm('Isso substituirá a versão que está na nuvem pelos dados deste aparelho. Deseja continuar?'))return;try{const rev=Number(pendingCloudConflict.revision)||remoteRevision;const {data,error}=await sb.from(cloudTable).update({data:db,revision:rev+1,updated_at:new Date().toISOString()}).eq('user_id',authUser.id).eq('revision',rev).select('revision').maybeSingle();if(error)throw error;if(!data)throw new Error('A nuvem mudou novamente. Atualize a tela e resolva o conflito mais recente.');remoteRevision=Number(data.revision);lastSyncedSnapshot=JSON.stringify(db);pendingCloudConflict=null;syncDirty=false;syncBadge('● Sincronizado','ok');closeM();}catch(e){alert(e.message||e);}}
async function signOutSync(){if(!confirm('Sair da conta neste aparelho? Os dados locais serão mantidos.'))return;const {error}=await sb.auth.signOut();if(error)alert(error.message);closeM();}
window.addEventListener('online',()=>{if(syncReady){if(pendingCloudConflict)syncBadge('● Conflito entre aparelhos','err');else if(syncDirty)syncNow();}});
window.addEventListener('offline',()=>{if(syncReady)syncBadge('● Offline — salvo neste aparelho','wait');});
window.addEventListener('load',()=>initCloud());
</script>
<script>
const K='aulaflow_padel_v1';const blank=()=>({students:[],lessons:[],tx:[]});let db;try{db=JSON.parse(localStorage.getItem(K))||blank()}catch{db=blank()}let tab='inicio',offset=0;
const $=s=>document.querySelector(s),id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6),iso=d=>d.toISOString().slice(0,10),br=s=>s?new Date(s+'T12:00:00').toLocaleDateString('pt-BR'):'',cash=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){localStorage.setItem(K,JSON.stringify(db));queueAutoBackup();if(syncReady){syncDirty=true;scheduleCloudSync()}render()}function setTab(t){tab=t;render()}function modal(t,b){$('#mt').textContent=t;$('#mb').innerHTML=b;$('#modal').classList.add('open')}function closeM(){$('#modal').classList.remove('open')}
function nav(){let a=['inicio','agenda','alunosaulas','alunos','financeiro','relatorios','backup'];$('#nav').innerHTML=a.map((x,i)=>`<button class="nav ${tab===x?'active':''}" onclick="setTab('${x}')">${['Visão geral','Agenda','Aulas por aluno','Alunos','Financeiro','Relatórios','Backup'][i]}</button>`).join('')}
function render(){nav();({inicio,agenda,alunosaulas,alunos,financeiro,relatorios,backup}[tab])()}
function item(l){let names=l.students.map(i=>db.students.find(s=>s.id===i)?.name||'').join(', ');let pending=['Agendada','Remarcada'].includes(l.status);return `<div class="item"><div><strong>${esc(l.time)} • ${esc(l.format)} — ${esc(names||'Sem aluno')}</strong><small>${br(l.date)} • ${l.duration} • ${esc(l.status)}</small></div><div class="actions">${pending?`<button class="btn primary" onclick="confirmLesson('${l.id}')">Confirmar aula</button>`:''}<button class="btn" onclick="lessonForm('${l.id}')">Editar</button></div></div>`}
function inicio(){
 const today=iso(new Date()), now=new Date();
 const todayLessons=db.lessons.filter(l=>l.date===today).sort((a,b)=>(a.time||'').localeCompare(b.time||''));
 const active=todayLessons.filter(l=>l.status!=='Cancelada');
 const done=todayLessons.filter(l=>l.status==='Concluída').length;
 const pendingLessons=todayLessons.filter(l=>['Agendada','Remarcada'].includes(l.status));
 const absences=todayLessons.filter(l=>['Falta com aviso','Falta sem aviso'].includes(l.status)).length;
 const canceled=todayLessons.filter(l=>l.status==='Cancelada').length;
 const todayReceived=db.tx.filter(t=>t.type==='Receita'&&t.status==='Pago'&&(t.paidAt||t.date)===today).reduce((a,t)=>a+(+t.amount||0),0);
 const todayToReceive=db.tx.filter(t=>t.type==='Receita'&&t.status!=='Pago'&&(t.dueDate||t.date)===today).reduce((a,t)=>a+(+t.amount||0),0);
 const todayExpenses=db.tx.filter(t=>t.type==='Despesa'&&t.date===today).reduce((a,t)=>a+(+t.amount||0),0);
 const lowCredits=db.students.filter(st=>st.pack!=='Avulso').map(st=>{
  const used=db.lessons.filter(l=>['Concluída','Falta sem aviso'].includes(l.status)&&l.packageUse&&(l.students||[]).includes(st.id)).length;
  return {...st,remaining:Math.max(0,(+st.credits||0)-used)};
 }).filter(st=>st.remaining===1);
 const debtors=db.students.map(st=>({...st,debt:db.tx.filter(t=>t.type==='Receita'&&t.studentId===st.id&&t.status!=='Pago').reduce((a,t)=>a+(+t.amount||0),0)})).filter(st=>st.debt>0);
 const weekday=now.toLocaleDateString('pt-BR',{weekday:'long'});
 const dateLabel=now.toLocaleDateString('pt-BR',{day:'2-digit',month:'long',year:'numeric'});
 const statusLabel=active.length?'<span class="good">Agenda em andamento</span>':'<span class="muted">Sem aulas programadas</span>';
 $('#view').innerHTML=`<div class="row"><div><h2>Seu dia no Padel 👋</h2><p class="sub">${weekday}, ${dateLabel} • ${statusLabel}</p></div><button class="btn primary" onclick="lessonForm()">+ Nova aula</button></div>
 <div class="grid">
  <div class="card metric"><small>Aulas de hoje</small><strong>${active.length}</strong><small>${done} concluída(s) • ${pendingLessons.length} pendente(s)</small></div>
  <div class="card metric"><small>Recebido hoje</small><strong class="green">${cash(todayReceived)}</strong><small>Pagamentos registrados para hoje</small></div>
  <div class="card metric"><small>A receber hoje</small><strong>${cash(todayToReceive)}</strong><small>Receitas com vencimento hoje</small></div>
  <div class="card metric"><small>Despesas de hoje</small><strong>${cash(todayExpenses)}</strong><small>${absences} falta(s) • ${canceled} cancelada(s)</small></div>
 </div>
 <div class="card"><div class="row"><div><h3>Agenda de hoje</h3><p class="sub">${todayLessons.length} horário(s) no total</p></div><button class="btn" onclick="setTab('agenda')">Abrir agenda</button></div><div class="list">${todayLessons.map(item).join('')||'<div class="empty">Nenhuma aula marcada para hoje. Aproveite para organizar sua agenda.</div>'}</div></div>
 <div class="grid">
  <div class="card"><h3>Resumo das aulas</h3><div class="list">
   <div class="item"><span>Concluídas</span><strong class="good">${done}</strong></div>
   <div class="item"><span>Aguardando confirmação</span><strong class="warn">${pendingLessons.length}</strong></div>
   <div class="item"><span>Faltas</span><strong>${absences}</strong></div>
   <div class="item"><span>Canceladas</span><strong>${canceled}</strong></div>
  </div></div>
  <div class="card"><h3>Alertas de alunos</h3><div class="list">
   ${lowCredits.map(st=>`<div class="item"><div><strong>${esc(st.name)}</strong><small class="warn">Resta 1 crédito</small></div><button class="btn" onclick="studentHistory('${st.id}')">Ver aluno</button></div>`).join('')}
   ${debtors.slice(0,4).map(st=>`<div class="item"><div><strong>${esc(st.name)}</strong><small class="bad">Pendente: ${cash(st.debt)}</small></div><button class="btn" onclick="studentHistory('${st.id}')">Ver aluno</button></div>`).join('')}
   ${!lowCredits.length&&!debtors.length?'<div class="empty">Nenhum alerta de crédito ou recebimento.</div>':''}
  </div></div>
 </div>
 <div class="card"><h3>Ações rápidas</h3><div class="actions"><button class="btn" onclick="studentForm()">+ Cadastrar aluno</button><button class="btn" onclick="txForm()">+ Lançamento financeiro</button><button class="btn" onclick="setTab('alunosaulas')">Consultar aulas por aluno</button></div></div>`;
}

function financeiro(){
 const m=$('#financeMonth')?.value||iso(new Date()).slice(0,7),kind=$('#financeKind')?.value||'Todos',category=$('#financeCategory')?.value||'Todas';
 const monthTx=db.tx.filter(x=>(x.date||'').startsWith(m));

 const pending=monthTx.filter(x=>x.type==='Receita'&&x.status!=='Pago').reduce((a,x)=>a+(+x.amount||0),0);
 const overdue=monthTx.filter(x=>x.type==='Receita'&&x.status!=='Pago'&&((x.dueDate||x.date)<iso(new Date()))).reduce((a,x)=>a+(+x.amount||0),0);
 const expenses=monthTx.filter(x=>x.type==='Despesa').reduce((a,x)=>a+(+x.amount||0),0);
 const accrued=monthTx.filter(x=>x.type==='Receita').reduce((a,x)=>a+(+x.amount||0),0);
 const cashResult=paidIn-monthTx.filter(x=>x.type==='Despesa'&&x.status==='Pago').reduce((a,x)=>a+(+x.amount||0),0);
 const competenceResult=accrued-expenses;
 const cats=['Quadra','Outros'];
 const list=db.tx.filter(x=>(x.date||'').startsWith(m)&&(kind==='Todos'||x.type===kind)&&(category==='Todas'||(x.category||'Outros')===category)).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
 const categoryRows=cats.map(c=>{const v=monthTx.filter(x=>x.type==='Despesa'&&(x.category||'Outros')===c).reduce((a,x)=>a+(+x.amount||0),0);return {c,v}});
 $('#view').innerHTML=`<div class="row"><div><h2>Financeiro 2.0</h2><p class="sub">Fluxo de caixa, resultado por competência e controle de recebimentos.</p></div><button class="btn primary" onclick="txForm()">+ Lançamento</button></div>

 <div class="card metric"><small>A receber</small><strong class="warn">${cash(pending)}</strong></div>
 <div class="card metric"><small>Em atraso</small><strong class="bad">${cash(overdue)}</strong></div>

 <div class="card"><h3>Despesas por categoria</h3><div class="list">${categoryRows.map(x=>`<div><div class="row"><span>${x.c}</span><b>${cash(x.v)}</b></div><div style="height:8px;background:#263744;border-radius:20px;overflow:hidden"><div style="height:100%;width:${expenses?Math.min(100,x.v/expenses*100):0}%;background:var(--g)"></div></div></div>`).join('')}</div></div>
 <div class="card"><div class="row"><h3>Contas a receber</h3><span class="tag">${monthTx.filter(x=>x.type==='Receita'&&x.status!=='Pago').length} pendência(s)</span></div><div class="list">${monthTx.filter(x=>x.type==='Receita'&&x.status!=='Pago').sort((a,b)=>(a.dueDate||a.date).localeCompare(b.dueDate||b.date)).map(x=>`<div class="item"><div><strong>${esc(x.desc)}</strong><small>${esc(x.category||'Receita')} • Vencimento: ${br(x.dueDate||x.date)} • ${esc(x.status)}</small></div><div class="actions"><b>${cash(x.amount)}</b><button class="btn primary" onclick="markPaid('${x.id}')">Recebido</button></div></div>`).join('')||'<div class="empty">Nenhuma conta a receber neste mês.</div>'}</div></div>
 <div class="card"><div class="row"><h3>Movimentações</h3><small>${list.length} lançamento(s)</small></div><div class="formgrid"><div><label>Tipo</label><select id="financeKind" onchange="financeiro()"><option ${kind==='Todos'?'selected':''}>Todos</option><option ${kind==='Receita'?'selected':''}>Receita</option><option ${kind==='Despesa'?'selected':''}>Despesa</option></select></div><div><label>Categoria</label><select id="financeCategory" onchange="financeiro()"><option ${category==='Todas'?'selected':''}>Todas</option><option ${category==='Quadra'?'selected':''}>Quadra</option><option ${category==='Outros'?'selected':''}>Outros</option></select></div></div><div class="list">${list.map(x=>`<div class="item"><div><strong>${esc(x.desc)}</strong><small>${br(x.date)} • ${esc(x.type)} • ${esc(x.category||'Outros')} • ${esc(x.status)}</small></div><div class="actions"><b class="${x.type==='Despesa'?'bad':'green'}">${x.type==='Despesa'?'-':''}${cash(x.amount)}</b>${x.type==='Receita'&&x.status!=='Pago'?`<button class="btn primary" onclick="markPaid('${x.id}')">Recebido</button>`:''}<button class="btn" onclick="delTx('${x.id}')">×</button></div></div>`).join('')||'<div class="empty">Sem lançamentos para os filtros selecionados.</div>'}</div></div>

function renderReports(){let el=$('#reportMonth');if(!el)return;let m=el.value,less=db.lessons.filter(l=>(l.date||'').startsWith(m)),tx=db.tx.filter(t=>(t.date||'').startsWith(m)),income=tx.filter(t=>t.type==='Receita'&&t.status==='Pago').reduce((a,t)=>a+(+t.amount||0),0),pending=tx.filter(t=>t.type==='Receita'&&t.status!=='Pago').reduce((a,t)=>a+(+t.amount||0),0),expenses=tx.filter(t=>t.type==='Despesa').reduce((a,t)=>a+(+t.amount||0),0),done=less.filter(l=>l.status==='Concluída').length,absNotice=less.filter(l=>l.status==='Falta com aviso'),absNo=less.filter(l=>l.status==='Falta sem aviso'),canceled=less.filter(l=>l.status==='Cancelada'),valid=less.filter(l=>l.status!=='Cancelada'),mins=valid.reduce((a,l)=>a+(l.duration==='1h30'?90:60),0),mins1=valid.filter(l=>(+l.courtNo||1)===1).reduce((a,l)=>a+(l.duration==='1h30'?90:60),0),mins2=valid.filter(l=>(+l.courtNo||1)===2).reduce((a,l)=>a+(l.duration==='1h30'?90:60),0),days=new Date(+m.slice(0,4),+m.slice(5,7),0).getDate(),capacityOne=days*12*60,capacity=capacityOne*2,occupancy=capacity?mins/capacity*100:0,makeups=db.lessons.filter(l=>l.isMakeup&&(l.date||'').startsWith(m)),pendingMakeups=db.lessons.filter(l=>l.status==='Falta com aviso'&&!l.repositioned);let html=`<div class="grid"><div class="card metric"><small>Receita recebida</small><strong>${cash(income)}</strong></div><div class="card metric"><small>Receita pendente</small><strong class="warn">${cash(pending)}</strong></div><div class="card metric"><small>Despesas</small><strong>${cash(expenses)}</strong></div><div class="card metric"><small>Resultado</small><strong class="green">${cash(income-expenses)}</strong></div></div><div class="card"><h3>Ocupação das quadras</h3><p>Horas reservadas no mês: <b>${(mins/60).toFixed(1).replace('.',',')} h</b> de ${(capacity/60).toFixed(0)} h disponíveis (2 quadras, 06h–18h).</p><div style="height:12px;background:#263744;border-radius:20px;overflow:hidden"><div style="height:100%;width:${Math.min(100,occupancy)}%;background:var(--g)"></div></div><p class="green"><b>${occupancy.toFixed(1).replace('.',',')}% de ocupação total estimada</b></p><div class="row"><span>Quadra 1</span><b>${(mins1/60).toFixed(1).replace('.',',')} h • ${capacityOne?(mins1/capacityOne*100).toFixed(1).replace('.',','):0}%</b></div><div style="height:8px;background:#263744;border-radius:20px;overflow:hidden"><div style="height:100%;width:${Math.min(100,capacityOne?mins1/capacityOne*100:0)}%;background:var(--g)"></div></div><div class="row"><span>Quadra 2</span><b>${(mins2/60).toFixed(1).replace('.',',')} h • ${capacityOne?(mins2/capacityOne*100).toFixed(1).replace('.',','):0}%</b></div><div style="height:8px;background:#263744;border-radius:20px;overflow:hidden"><div style="height:100%;width:${Math.min(100,capacityOne?mins2/capacityOne*100:0)}%;background:var(--g)"></div></div><small>Estimativa considerando todos os dias do mês e 12 horas disponíveis por dia em cada quadra.</small></div><div class="grid"><div class="card metric"><small>Aulas concluídas</small><strong>${done}</strong></div><div class="card metric"><small>Faltas com aviso</small><strong class="warn">${absNotice.length}</strong></div><div class="card metric"><small>Faltas sem aviso</small><strong class="bad">${absNo.length}</strong></div><div class="card metric"><small>Cancelamentos</small><strong>${canceled.length}</strong></div></div><div class="card"><h3>Reposições pendentes</h3><p class="muted">Faltas com aviso que ainda não têm reposição agendada.</p><div class="list">${pendingMakeups.map(l=>`<div class="item"><div><strong>${esc((l.students||[]).map(sid=>db.students.find(s=>s.id===sid)?.name||'').join(', '))}</strong><small>Falta em ${br(l.date)} • ${l.time}</small></div><button class="btn primary" onclick="scheduleMakeup('${l.id}')">Agendar reposição</button></div>`).join('')||'<div class="empty">Nenhuma reposição pendente.</div>'}</div><h3>Reposições já agendadas no mês</h3><div class="list">${makeups.map(l=>`<div class="item"><div><strong>${esc((l.students||[]).map(sid=>db.students.find(s=>s.id===sid)?.name||'').join(', '))}</strong><small>${br(l.date)} • ${l.time} • ${esc(l.status)}</small></div></div>`).join('')||'<div class="empty">Nenhuma reposição neste mês.</div>'}</div></div><div class="card"><h3>Faltas e cancelamentos</h3><div class="list">${[...absNotice,...absNo,...canceled].sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time)).map(l=>`<div class="item"><div><strong>${esc((l.students||[]).map(sid=>db.students.find(s=>s.id===sid)?.name||'').join(', '))}</strong><small>${br(l.date)} • ${l.time} • ${esc(l.status)}</small></div><span class="tag">${l.isMakeup?'Reposição':'Aula'}</span></div>`).join('')||'<div class="empty">Nenhuma falta ou aula cancelada no período.</div>'}</div></div>`;$('#reportContent').innerHTML=html}
function scheduleMakeup(originalId){let original=db.lessons.find(l=>l.id===originalId);if(!original)return;let names=(original.students||[]).map(sid=>db.students.find(s=>s.id===sid)?.name||'').join(', ');modal('Agendar reposição',`<p class="muted">Reposição de falta com aviso • ${esc(names)}</p><form id="makeupf" class="formgrid"><div><label>Data *</label><input name="date" type="date" min="${iso(new Date())}" value="${iso(new Date())}" required></div><div><label>Horário</label><select name="time">${Array.from({length:25},(_,i)=>{let h=6+Math.floor(i/2),t=String(h).padStart(2,'0')+':'+(i%2?'30':'00');return `<option>${t}</option>`}).join('')}</select></div><div><label>Duração</label><select name="duration"><option>${esc(original.duration||'1h')}</option><option>1h</option><option>1h30</option></select></div><div><label>Quadra</label><select name="courtNo"><option value="1">Quadra 1</option><option value="2">Quadra 2</option></select></div></form><div class="actions"><button class="btn primary" onclick="saveMakeup('${originalId}')">Salvar reposição</button></div>`)}
function saveMakeup(originalId){let f=$('#makeupf');if(!f.reportValidity())return;let original=db.lessons.find(l=>l.id===originalId);if(!original)return;let x=Object.fromEntries(new FormData(f));let lesson={id:id(),date:x.date,time:x.time,duration:x.duration,format:original.format||'Individual',status:'Agendada',students:[...(original.students||[])],value:0,court:0,courtNo:+x.courtNo||1,packageUse:false,isMakeup:true,makeupFor:originalId,notes:'Reposição de falta com aviso'};if(hasConflict(lesson,null))return alert('Já existe uma aula nesse horário. Escolha outro horário.');db.lessons.push(lesson);original.repositioned=true;closeM();save();setTab('relatorios')}
function backup(){$('#view').innerHTML=`<h2>Central de Backup</h2><p class="sub">Proteja seus alunos, agenda, créditos, histórico técnico e financeiro.</p><div class="grid"><div class="card metric"><small>Proteção local</small><strong class="green">Ativa</strong><small>Snapshots automáticos neste navegador</small></div><div class="card metric"><small>Último backup</small><strong id="lastBackup">Verificando…</strong><small>Histórico local de até 10 cópias</small></div></div><div class="card"><h3>Backup imediato</h3><p class="muted">Cria uma cópia local e baixa um arquivo JSON completo. Faça isso antes de trocar de dispositivo ou restaurar dados.</p><div class="actions"><button class="btn primary" onclick="createBackupAndDownload()">Criar e baixar backup</button><button class="btn" onclick="exportData()">Baixar cópia JSON</button></div></div><div class="card"><h3>Google Drive</h3><p class="muted">Nesta etapa, o envio é manual: baixe o JSON e envie para uma pasta chamada <b>AulaFlow Backups</b> no seu Google Drive. A conexão automática exigirá configuração OAuth própria e publicação do aplicativo em HTTPS.</p><div class="actions"><button class="btn primary" onclick="createBackupAndDownload()">Preparar arquivo para o Drive</button><button class="btn" onclick="window.open('https://drive.google.com/drive/my-drive','_blank','noopener')">Abrir Google Drive ↗</button></div></div><div class="card"><h3>Histórico de cópias locais</h3><p class="muted">As últimas 10 cópias feitas neste navegador. Para proteção contra perda do dispositivo ou limpeza do navegador, mantenha também cópias no Drive.</p><div id="backupHistory" class="list"><div class="empty">Carregando histórico…</div></div></div><div class="card"><h3>Restaurar arquivo externo</h3><p class="muted">Selecione um backup JSON baixado do computador ou Google Drive. O sistema valida o arquivo antes de substituir os dados.</p><input id="file" type="file" accept=".json,application/json"><button class="btn" style="margin-top:10px" onclick="importData()">Validar e restaurar arquivo</button></div><div class="card"><h3>Limpar dados</h3><p class="muted">Atenção: apaga os dados operacionais deste navegador. Faça um backup externo antes.</p><button class="btn danger" onclick="if(confirm('Apagar todos os dados deste dispositivo? Faça backup antes.')){db={students:[],lessons:[],tx:[]};save()}">Apagar tudo</button></div>`;renderBackupHistory()}
function studentForm(sid){let s=db.students.find(x=>x.id===sid)||{name:'',phone:'',pack:'Avulso',credits:0};modal(sid?'Editar aluno':'Novo aluno',`<form id="sf" class="formgrid"><div class="full"><label>Nome *</label><input name="name" required value="${esc(s.name)}"></div><div><label>Telefone</label><input name="phone" value="${esc(s.phone)}"></div><div><label>Pacote</label><select name="pack">${['Avulso','Pacote 4 aulas','Pacote 8 aulas'].map(a=>`<option ${s.pack===a?'selected':''}>${a}</option>`)}</select></div><div><label>Créditos incluídos</label><input name="credits" type="number" min="0" value="${s.credits}"></div></form><div class="actions"><button class="btn primary" onclick="saveStudent('${sid||''}')">Salvar</button>${sid?`<button class="btn danger" onclick="if(confirm('Excluir aluno?')){db.students=db.students.filter(x=>x.id!=='${sid}');closeM();save()}">Excluir</button>`:''}</div>`)}
function saveStudent(sid){let f=$('#sf');if(!f.reportValidity())return;let x=Object.fromEntries(new FormData(f));x.id=sid||id();x.credits=+x.credits;if(sid)db.students=db.students.map(a=>a.id===sid?x:a);else db.students.push(x);closeM();save()}
function packageSale(sid){const st=db.students.find(x=>x.id===sid);if(!st)return;const current=st.pack==='Pacote 8 aulas'?'Pacote 8 aulas':'Pacote 4 aulas';modal('Registrar venda de pacote',`<form id="pf" class="formgrid"><div class="full"><label>Aluno</label><input value="${esc(st.name)}" disabled></div><div><label>Pacote</label><select name="pack"><option ${current==='Pacote 4 aulas'?'selected':''}>Pacote 4 aulas</option><option ${current==='Pacote 8 aulas'?'selected':''}>Pacote 8 aulas</option></select></div><div><label>Valor recebido (R$)</label><input name="amount" type="number" min="0.01" step=".01" required></div><div><label>Data do pagamento</label><input name="date" type="date" value="${iso(new Date())}" required></div><div><label>Status</label><select name="status"><option>Pago</option><option>Pendente</option></select></div></form><p class="muted">Adiciona 4 ou 8 créditos ao saldo atual e registra a receita no financeiro.</p><div class="actions"><button class="btn primary" onclick="savePackageSale('${sid}')">Confirmar venda</button></div>`)}
function savePackageSale(sid){const f=$('#pf');if(!f.reportValidity())return;const x=Object.fromEntries(new FormData(f)),st=db.students.find(a=>a.id===sid);if(!st)return;const n=x.pack==='Pacote 8 aulas'?8:4;st.pack=x.pack;st.credits=(+st.credits||0)+n;db.tx.push({id:id(),source:'pacote',studentId:sid,desc:x.pack+' • '+st.name,type:'Receita',amount:+x.amount,date:x.date,status:x.status,category:'Venda de pacote'});closeM();save()}
function lessonForm(lid){let x=db.lessons.find(a=>a.id===lid)||{date:iso(new Date()),time:'06:00',duration:'1h',format:'Individual',status:'Agendada',students:[],value:0,court:80,courtNo:1,packageUse:true};let opts=db.students.map(s=>`<option value="${s.id}" ${x.students.includes(s.id)?'selected':''}>${esc(s.name)}</option>`).join('');modal(lid?'Editar aula':'Nova aula',`<form id="lf" class="formgrid"><div><label>Data *</label><input name="date" type="date" required value="${x.date}"></div><div><label>Horário</label><select name="time">${Array.from({length:25},(_,i)=>{let h=6+Math.floor(i/2),t=String(h).padStart(2,'0')+':'+(i%2?'30':'00');return `<option ${x.time===t?'selected':''}>${t}</option>`}).join('')}</select></div><div><label>Duração</label><select name="duration"><option ${x.duration==='1h'?'selected':''}>1h</option><option ${x.duration==='1h30'?'selected':''}>1h30</option></select></div><div><label>Formato</label><select name="format">${['Individual','Dupla','Trio','Quarteto'].map(a=>`<option ${x.format===a?'selected':''}>${a}</option>`).join('')}</select></div><div><label>Quadra</label><select name="courtNo"><option value="1" ${(+x.courtNo||1)===1?'selected':''}>Quadra 1</option><option value="2" ${(+x.courtNo||1)===2?'selected':''}>Quadra 2</option></select></div><div class="full"><label>Alunos (até 4)</label><select name="students" multiple size="4">${opts}</select><small>Para selecionar vários, use o controle de seleção múltipla.</small></div><div><label>Status</label><select name="status">${['Agendada','Concluída','Cancelada','Remarcada','Falta com aviso','Falta sem aviso'].map(a=>`<option ${x.status===a?'selected':''}>${a}</option>`).join('')}</select></div><div><label>Valor por aluno (R$)</label><input name="value" type="number" min="0" step=".01" value="${x.value}"></div><div><label>Custo automático da quadra</label><input name="court" type="number" value="80" readonly><small>R$ 80,00 por aula confirmada.</small></div><div><label>Desconta pacote?</label><select name="packageUse"><option value="true" ${x.packageUse?'selected':''}>Sim</option><option value="false" ${!x.packageUse?'selected':''}>Não</option></select></div>${!lid?`<div class="full card" style="margin:0;padding:12px"><label><input type="checkbox" name="recurring" value="yes" style="width:auto" onchange="$('#repeatFields').style.display=this.checked?'grid':'none'"> Repetir esta aula semanalmente</label><div id="repeatFields" class="formgrid" style="display:none;margin-top:10px"><div class="full"><label>Repetir até</label><input name="repeatUntil" type="date" min="${x.date}" value="${x.date}"></div></div><small>Serão criadas aulas no mesmo dia da semana e horário até a data escolhida.</small></div>`:''}<div class="full"><label>Observações</label><textarea name="notes">${esc(x.notes||'')}</textarea></div></form><div class="actions"><button class="btn primary" onclick="saveLesson('${lid||''}')">Salvar aula</button>${lid?`<button class="btn danger" onclick="if(confirm('Excluir aula?')){db.tx=db.tx.filter(t=>!(t.sourceId&&t.sourceId.startsWith('lesson:${lid}:')));db.lessons=db.lessons.filter(a=>a.id!=='${lid}');closeM();save()}">Excluir</button>`:''}</div>`)}
function overlaps(a,b){const mins=t=>{let [h,m]=t.split(':').map(Number);return h*60+m};let a0=mins(a.time),a1=a0+(a.duration==='1h30'?90:60),b0=mins(b.time),b1=b0+(b.duration==='1h30'?90:60);return a0<b1&&b0<a1}
function hasConflict(candidate,ignoreId){return db.lessons.some(l=>l.id!==ignoreId&&l.date===candidate.date&&l.status!=='Cancelada'&&overlaps(l,candidate))}
function confirmLesson(lid){const l=db.lessons.find(x=>x.id===lid);if(!l)return;const names=l.students.map(i=>db.students.find(s=>s.id===i)?.name||'').join(', ');modal('Confirmar aula do horário',`<p class="muted">${br(l.date)} • ${l.time} • ${esc(names||'Sem aluno')}</p><p>O que aconteceu neste horário?</p><div class="actions"><button class="btn primary" onclick="setLessonStatus('${lid}','Concluída')">✓ Aula concluída</button><button class="btn" onclick="setLessonStatus('${lid}','Falta com aviso')">Falta com aviso</button><button class="btn danger" onclick="setLessonStatus('${lid}','Falta sem aviso')">Falta sem aviso</button></div><p class="muted">Concluída e falta sem aviso geram os lançamentos financeiros e o desconto de crédito conforme as regras do aplicativo. Falta com aviso não gera cobrança nem desconto.</p>`)}
function setLessonStatus(lid,status){const l=db.lessons.find(x=>x.id===lid);if(!l)return;l.status=status;syncLessonFinance(l);closeM();save()}
function syncLessonFinance(l){
 const prefix='lesson:'+l.id+':',old=db.tx.filter(t=>t.sourceId&&t.sourceId.startsWith(prefix)),oldById=Object.fromEntries(old.map(t=>[t.sourceId,t]));
 db.tx=db.tx.filter(t=>!(t.sourceId&&t.sourceId.startsWith(prefix)));
 if(!['Concluída','Falta sem aviso'].includes(l.status))return;
 const key=prefix+'court';db.tx.push({id:oldById[key]?.id||id(),sourceId:key,source:'aula',desc:'Quadra • '+l.date+' '+l.time,type:'Despesa',amount:80,date:l.date,status:oldById[key]?.status||'Pago',category:'Quadra'});
 l.students.forEach(sid=>{const st=db.students.find(a=>a.id===sid);if(!st||st.pack!=='Avulso'||l.value<=0)return;const key=prefix+'aluno:'+sid,prior=oldById[key];db.tx.push({id:prior?.id||id(),sourceId:key,source:'aula',studentId:sid,lessonId:l.id,desc:(l.status==='Falta sem aviso'?'Falta sem aviso':'Aula concluída')+' • '+st.name+' • '+l.date,type:'Receita',amount:l.value,date:l.date,status:prior?.status||'Pendente',category:'Aula avulsa'});});
}
function saveLesson(lid){let f=$('#lf');if(!f.reportValidity())return;let x=Object.fromEntries(new FormData(f));x.students=Array.from(f.elements.students.selectedOptions).map(o=>o.value);if(x.students.length>4)return alert('Selecione no máximo quatro alunos.');Object.assign(x,{id:lid||id(),value:+x.value,court:+x.court,courtNo:+x.courtNo||1,packageUse:x.packageUse==='true'});if(hasConflict(x,lid))return alert('Conflito de horário: já existe uma aula nesse período. Escolha outro horário.');if(lid){db.lessons=db.lessons.map(a=>a.id===lid?x:a);syncLessonFinance(x);closeM();save();return;}const recurring=f.elements.recurring?.checked,until=f.elements.repeatUntil?.value;let dates=[x.date];if(recurring){if(!until||until<x.date)return alert('Escolha uma data final válida para a recorrência.');let d=new Date(x.date+'T12:00:00'),last=new Date(until+'T12:00:00');while(true){d.setDate(d.getDate()+7);if(d>last)break;dates.push(iso(d));if(dates.length>105)break;}}let added=0,skipped=0;dates.forEach(date=>{let item={...x,id:id(),date};if(hasConflict(item,null)){skipped++;return;}db.lessons.push(item);syncLessonFinance(item);added++;});closeM();save();if(recurring)alert(`${added} aula(s) criada(s).${skipped?` ${skipped} ocorrência(s) ignorada(s) por conflito de horário.`:''}`)}
function txForm(){modal('Novo lançamento',`<form id="tf" class="formgrid"><div class="full"><label>Descrição *</label><input name="desc" required></div><div><label>Tipo</label><select name="type" id="txType" onchange="updateTxCategories()"><option>Receita</option><option>Despesa</option></select></div><div><label>Valor (R$)</label><input name="amount" type="number" min=".01" step=".01" required></div><div><label>Data do lançamento</label><input name="date" type="date" value="${iso(new Date())}" required></div><div><label>Vencimento (receitas)</label><input name="dueDate" type="date"></div><div><label>Status</label><select name="status"><option>Pago</option><option>Pendente</option><option>Atrasado</option></select></div><div><label>Categoria</label><select name="category" id="txCategory"><option>Outros</option><option>Quadra</option></select></div></form><p class="sync-note">Use Quadra para custos de locação. Outras entradas e saídas ficam em Outros.</p><div class="actions"><button class="btn primary" onclick="saveTx()">Salvar</button></div>`)}
function updateTxCategories(){const f=$('#txCategory');if(f)f.innerHTML='<option>Outros</option><option>Quadra</option>'}
function saveTx(){let f=$('#tf');if(!f.reportValidity())return;let x=Object.fromEntries(new FormData(f));x.id=id();x.amount=+x.amount;if(!x.dueDate)delete x.dueDate;if(x.type==='Receita'&&x.status==='Pago')x.paidAt=x.date;db.tx.push(x);closeM();save()}
function markPaid(tid){let t=db.tx.find(x=>x.id===tid);if(t){t.status='Pago';t.paidAt=iso(new Date());save()}}
function delTx(tid){if(confirm('Excluir lançamento?')){db.tx=db.tx.filter(x=>x.id!==tid);save()}}
